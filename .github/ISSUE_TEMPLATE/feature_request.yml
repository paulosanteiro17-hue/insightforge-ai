name: Feature request
description: Propose a focused product or engineering improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or engineering problem this proposal should solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the desired behavior and why it fits the project.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe reasonable alternatives or workarounds.
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Security and tenant-isolation impact
      description: Note any effect on authentication, authorization, data isolation, privacy, or external services.
    validations:
      required: true
